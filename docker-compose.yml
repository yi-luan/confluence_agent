# 一行啟動：docker compose up -d --build
# 首次啟動後灌入範例資料：docker compose exec app python -m app.cli seed
#
# 服務：
#   app        http://localhost:8000/docs   API + Swagger
#   prometheus http://localhost:9090        指標收集
#   grafana    http://localhost:3000        儀表板（admin / admin）
#   ollama     本機 LLM（--profile local-llm 才會啟動）

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kb
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kb"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/kb
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  ollama:
