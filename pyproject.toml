[project]
name = "confluence-agent"
version = "2.0.0"
description = "Enterprise knowledge-base agent: Confluence/Markdown RAG with LangGraph, pgvector and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() 預設參數是慣用寫法

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
